<!doctype html>
<!-- A stand-in for WhatsApp Web with the same landmarks Natter's bridge looks for:
     #side with a search box and filter chips, #pane-side with virtualised rows, #main with a
     header (WhatsApp's disabled call buttons included) and composer.
     Run a separate Natter against it (see README, "When WhatsApp changes"): --url only works
     with an app id of its own, e.g. NATTER_APP_ID=io.github.Officialbabs.Natter.Dev plus XDG_*_HOME.
     Add ?link to start on the link screen (a QR code); linkPhone() then shows the chats.
     For replies from notifications: each chat has an id (the notifications' tag), the open chat's
     messages are keyed "<mine>_<chat id>_<id>", the Send button stands in for the voice note
     button a timer tick after there are words, and the drawers are as WhatsApp's: always there and
     never empty (each holds a drawer manager, a <div> with an empty <span>, while nothing's open).
     What opens goes in that span (openDrawer): a pasted or dropped file's preview, shaped like
     WhatsApp's media editor, in the middle one; an empty state there, as beside Status; Settings
     or a new group over the chat list. A notification's click closes the left one, as WhatsApp's.
     sentMessages and voicePresses say what was sent and pressed. -->
<html>
<head>
<meta charset="utf-8">
<title>(3) WhatsApp</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #f0f2f5; color: #111b21; }
  @media (prefers-color-scheme: dark) { body { background: #111b21; color: #e9edef; } }
  #app { display: flex; height: 100vh; }
  #side { width: 340px; border-right: 1px solid #8884; display: flex; flex-direction: column; }
  #search { margin: 10px; padding: 8px 12px; border-radius: 8px; background: #8882; min-height: 1.2em; outline: none; }
  [role="tablist"] { display: flex; gap: 6px; margin: 0 10px 8px; }
  [role="tab"] { border: 0; border-radius: 12px; padding: 4px 10px; background: #8882; color: inherit; font: inherit; }
  [role="tab"][aria-selected="true"] { background: #2ec27e44; }
  #pane-side { position: relative; flex: 1; overflow-y: auto; }
  #grid { position: relative; }
  [role="listitem"] { position: absolute; left: 0; right: 0; height: 64px; display: flex; align-items: center;
                      gap: 12px; padding: 0 12px; box-sizing: border-box; cursor: pointer; }
  [role="listitem"]:hover { background: #8881; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: #2ec27e; flex: none; }
  .preview { opacity: .65; font-size: 13px; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #main header { padding: 14px 16px; font-weight: 600; border-bottom: 1px solid #8884; display: flex; gap: 8px; }
  #main header span[title] { flex: 1; }
  #main header button { border: 0; background: none; font-size: 16px; }
  #main header button[disabled] { opacity: .35; }
  #messages { flex: 1; padding: 16px; }
  .message-in, .message-out { max-width: 60%; padding: 6px 10px; border-radius: 8px; margin: 4px 0; background: #8882; }
  .message-out { margin-left: auto; background: #2ec27e44; }
  footer { padding: 10px; }
  footer [contenteditable] { padding: 10px; border-radius: 8px; background: #8882; outline: none; }
  #drop { display: none; position: absolute; inset: 0; background: #2ec27e55; align-items: center; justify-content: center; }
  [data-testid^="drawer-"] { position: absolute; top: 0; z-index: 1; }
  [data-testid="drawer-left"] { left: 0; width: 340px; } [data-testid="drawer-middle"] { left: 341px; right: 0; }
  [data-testid="drawer-right"] { right: 0; }
  #preview, .panel { padding: 16px; background: #f0f2f5; }
  @media (prefers-color-scheme: dark) { #preview, .panel { background: #111b21; } }
  #preview [contenteditable], .panel [contenteditable], .panel input { margin: 8px 0; padding: 8px; border-radius: 8px; background: #8882; }
  footer { display: flex; gap: 8px; align-items: end; } footer [contenteditable] { flex: 1; }
  footer button { border: 0; background: none; font-size: 18px; }
  .landing { margin: auto; text-align: center; }
  .landing canvas { width: 160px; height: 160px; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="app"></div>
<template id="chats">
  <div data-testid="drawer-left"><div><span></span></div></div>
  <div data-testid="drawer-middle"><div><span></span></div></div>
  <div data-testid="drawer-right"><span></span></div>
  <div id="side">
    <div id="search" contenteditable="true" role="textbox" title="Search"></div>
    <div role="tablist" aria-label="Chat filters">
      <button role="tab" aria-selected="true" data-filter="">All</button>
      <button role="tab" aria-selected="false" data-filter="unread">Unread</button>
      <button role="tab" aria-selected="false" data-filter="groups">Groups</button>
    </div>
    <div id="pane-side"><div id="grid" aria-label="Chat list" role="grid"></div></div>
  </div>
  <div id="main" style="position: relative">
    <header></header>
    <div id="messages"></div>
    <footer><div contenteditable="true" role="textbox" title="Type a message"></div><span id="send-slot"></span></footer>
    <div id="drop">Drop files here</div>
  </div>
</template>
<!-- What opens in a drawer (openDrawer). WhatsApp's media editor: the files' preview, a caption box,
     "Add file", Send, and the editor's own hidden file input, which takes more files while it's open. -->
<template id="media-editor">
  <div id="preview" role="dialog" tabindex="-1">
    <span id="preview-names"></span>
    <div contenteditable="true" role="textbox" data-testid="media-caption-input-container" aria-label="Add a caption"><p><br></p></div>
    <button data-testid="media-editor-add-more" aria-label="Add file">+</button>
    <div role="button" tabindex="0" aria-label="Send"><span data-icon="wds-ic-send-filled">➤</span></div>
    <input type="file" multiple style="display: none">
  </div>
</template>
<!-- Beside Status, Calls or Settings, WhatsApp's middle drawer holds an empty state. -->
<template id="empty-state">
  <div data-testid="empty-state-drawer"><p data-testid="empty-state-title">Status</p>
    <p data-testid="empty-state-paragraph">Share photos, videos and text that disappear after 24 hours</p></div>
</template>
<template id="settings">
  <div class="panel" aria-label="Settings"><input type="text" aria-label="Search settings" placeholder="Search settings">
    <p>Account · Privacy · Chats · Notifications</p></div>
</template>
<template id="new-group">
  <div class="panel" aria-label="New group"><div contenteditable="true" role="textbox" aria-label="Group subject"><p><br></p></div></div>
</template>
<template id="link-screen">
  <div class="landing">
    <p>Scan to link a device</p>
    <div class="qr" data-ref="2@mock-ref"></div>
  </div>
</template>
<script>
  // 41 chats; only the first 12 are ever in the page, like WhatsApp's virtualised list. The number
  // is an unsaved contact, wrapped in bidi marks (U+202A … U+202C) the way WhatsApp writes numbers.
  const CHATS = ["Mum", "Work Team", "Ana Souza", "Football Sunday", "Dad", "Joana", "Landlord", "Book Club",
    "\u202a+44 7700 900123\u202c", ...Array.from({ length: 32 }, (_, i) => `Old Friend ${i + 1}`)];
  const FILTERS = { unread: ["Work Team", "Ana Souza"], groups: ["Work Team", "Football Sunday", "Book Club"] };
  const NUMBERS = { "15550100": "Dad", "5511987654321": "Ana Souza" };
  // WhatsApp's id for each chat: a number @c.us for a person, @g.us for a group.
  const IDS = Object.fromEntries(CHATS.map((name, i) => [name, FILTERS.groups.includes(name)
    ? `1203630412345678${10 + i}@g.us` : `4477009001${String(i).padStart(2, "0")}@c.us`]));
  const app = document.getElementById("app");
  let filter = "", openName = "", sent = 0;
  const drafts = {};  // what was left in each chat's box, put back when it opens again
  window.sentMessages = [];
  window.voicePresses = 0;

  function render() {
    const query = document.getElementById("search").textContent.trim().toLowerCase();
    const list = (filter ? FILTERS[filter] : CHATS).filter((c) => !query || c.toLowerCase().includes(query));
    const grid = document.getElementById("grid");
    grid.replaceChildren();
    grid.style.height = list.length * 64 + "px";
    list.slice(0, 12).forEach((name, i) => {
      const row = document.createElement("div");
      row.setAttribute("role", "listitem");
      row.style.transform = `translateY(${i * 64}px)`;
      row.innerHTML = `<div class="avatar"></div><div><div data-testid="cell-frame-title"><span dir="auto" title="${name}">${name}</span></div>
        <div class="preview"><span title="secret last message from ${name}">secret last message</span></div></div>`;
      row.addEventListener("mousedown", () => open(name));
      grid.appendChild(row);
    });
  }

  // Each chat's header is drawn anew, WhatsApp's call buttons disabled again, as in WebKitGTK.
  function header(name) {
    document.querySelector("#main header").innerHTML = `<span dir="auto" title="${name}">${name}</span>
      <button aria-label="Video call" disabled><span data-icon="video-call">🎥</span></button>
      <button aria-label="Voice call" disabled><span data-icon="voice-call">📞</span></button>`;
  }

  // The chat's messages, keyed as WhatsApp keys them.
  function messages(name) {
    const rows = name === "Mum" ? [["in", "Did you eat?"], ["out", "Yes mum"]] : [["in", "See you later"]];
    document.getElementById("messages").replaceChildren(...rows.map(([way, text], i) => {
      const row = document.createElement("div");
      row.className = `message-${way}`;
      row.setAttribute("data-id", `${way === "out"}_${IDS[name]}_3EB0MOCK${i}`);
      row.textContent = text;
      return row;
    }));
  }

  function open(name) {
    if (openName) drafts[openName] = composer().textContent;
    setTimeout(() => {
      header(name);
      messages(name);
      openName = name;
      composer().textContent = drafts[name] || "";
      slot();
    }, 120);
    return new Promise((resolve) => setTimeout(resolve, 130));
  }

  const composer = () => document.querySelector("footer [contenteditable]");

  // Send while there are words, the voice note button otherwise: a timer tick after they change.
  function slot() {
    const words = composer().textContent.trim();
    document.getElementById("send-slot").innerHTML = words
      ? '<button aria-label="Send"><span data-icon="wds-ic-send-filled"><svg width="20" height="20"><title>ic-send-filled</title><text y="16">➤</text></svg></span></button>'
      : '<button aria-label="Voice message"><span data-icon="ic-mic-outlined"><svg width="20" height="20"><title>ic-mic-outlined</title><text y="16">🎤</text></svg></span></button>';
    document.querySelector("#send-slot button").addEventListener("click", () => {
      if (!words) {
        window.voicePresses++;
        return;
      }
      window.sentMessages.push({ chat: IDS[openName], text: composer().innerText.trim() });
      const row = document.createElement("div");
      row.className = "message-out";
      row.setAttribute("data-id", `true_${IDS[openName]}_3EB0SENT${++sent}`);
      row.textContent = composer().innerText.trim();
      document.getElementById("messages").appendChild(row);
      composer().textContent = "";
      setTimeout(slot, 0);
    });
  }

  // Opens `template` in one of the drawers ("left", "middle", "right"), in its drawer manager's
  // span, as WhatsApp's drawer manager does; with no template, closes what's there.
  function openDrawer(key, template) {
    const slot = document.querySelector(`[data-testid="drawer-${key}"] span`);
    slot.replaceChildren(...(template ? [document.getElementById(template).content.cloneNode(true)] : []));
  }
  window.openDrawer = openDrawer;

  // The preview of files waiting to be sent. More files come in through its own hidden input
  // (window.addedFiles); its Send sends them (window.previewSends) and closes it.
  function showPreview(names) {
    openDrawer("middle", "media-editor");
    document.getElementById("preview-names").textContent = names;
    const more = document.querySelector('#preview input[type="file"]');
    document.querySelector('#preview [data-testid="media-editor-add-more"]').addEventListener("click", () => more.click());
    more.addEventListener("change", () => {
      window.addedFiles = [...more.files].map((f) => [f.name, f.size, f.type]);
      document.getElementById("preview-names").textContent += ", " + [...more.files].map((f) => f.name).join(", ");
    });
    document.querySelector('#preview [aria-label="Send"]').addEventListener("click", () => {
      window.previewSends = (window.previewSends || 0) + 1;
      openDrawer("middle");
    });
  }

  function showChats() {
    app.replaceChildren(document.getElementById("chats").content.cloneNode(true));
    header("Mum");
    messages("Mum");
    openName = "Mum";
    slot();
    composer().addEventListener("input", () => setTimeout(slot, 0));
    const search = document.getElementById("search");
    search.addEventListener("input", () => setTimeout(render, 150));
    document.querySelectorAll('[role="tab"]').forEach((chip) => chip.addEventListener("click", () => {
      document.querySelectorAll('[role="tab"]').forEach((other) => other.setAttribute("aria-selected", String(other === chip)));
      filter = chip.dataset.filter;
      render();
    }));
    render();

    // Dropping files shows a "preview" like WhatsApp's.
    const main = document.getElementById("main");
    const drop = document.getElementById("drop");
    main.addEventListener("dragenter", (e) => { e.preventDefault(); drop.style.display = "flex"; });
    drop.addEventListener("dragover", (e) => e.preventDefault());
    drop.addEventListener("drop", (e) => {
      e.preventDefault();
      drop.style.display = "none";
      showPreview([...e.dataTransfer.files].map((f) => `${f.name} (${f.size} bytes)`).join(", "));
      window.droppedFiles = [...e.dataTransfer.files].map((f) => [f.name, f.size, f.type]);
    });

    // Pasting files into the message box, like WhatsApp: a preview of what was pasted.
    document.querySelector('footer [contenteditable]').addEventListener("paste", (e) => {
      const files = [...(e.clipboardData ? e.clipboardData.files : [])];
      if (!files.length) return;
      e.preventDefault();
      showPreview(files.map((f) => f.name).join(", "));
      window.pastedFiles = files.map((f) => [f.name, f.size, f.type]);
    });
  }

  // The link screen: the QR code is drawn a moment after the screen itself, as WhatsApp's is.
  function showLinkScreen() {
    app.replaceChildren(document.getElementById("link-screen").content.cloneNode(true));
    setTimeout(() => {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 21;
      canvas.setAttribute("aria-label", "Scan this QR code to link a device");
      document.querySelector(".qr").appendChild(canvas);
    }, 300);
  }
  window.linkPhone = showChats;

  // Assumed, not checked against WhatsApp: a wa.me link clicked in the page opens its chat in
  // place (WhatsApp does this for links in messages; whether it does for any link isn't known).
  document.addEventListener("click", (e) => {
    const link = e.target.closest && e.target.closest('a[href^="https://wa.me/"]');
    if (!link) return;
    e.preventDefault();
    const name = NUMBERS[new URL(link.href).pathname.slice(1)];
    if (name) open(name);
  });

  // A message notification, the way WhatsApp makes one, with a PNG picture.
  window.fakeMessage = (from, text) => {
    const picture = document.createElement("canvas");
    picture.width = picture.height = 64;
    const paint = picture.getContext("2d");
    paint.fillStyle = "#e66100";
    paint.fillRect(0, 0, 64, 64);
    const n = new Notification(from, { body: text, tag: IDS[from], icon: picture.toDataURL("image/png") });
    // As WhatsApp's own handler: the left drawer closes, the chat opens by its id, then its box has focus.
    n.onclick = () => {
      window.focus();
      openDrawer("left");
      open(from).then(() => composer().focus());
      window.clickedNotification = from;
      n.close();
    };
    return n.id ?? true;
  };

  if (new URLSearchParams(location.search).has("link")) showLinkScreen(); else showChats();
</script>
</body>
</html>
